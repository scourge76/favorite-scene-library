name: Deploy Kodi repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build Kodi repository
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import html
          import shutil
          import zipfile
          import xml.etree.ElementTree as ET

          root = Path.cwd()
          public = root / "public"
          if public.exists():
              shutil.rmtree(public)
          public.mkdir()

          plugin_id = "plugin.video.favoritescenelibrary"
          plugin_version = ET.parse(root / "addon.xml").getroot().attrib["version"]
          repo_id = "repository.fsl"
          repo_version = ET.parse(root / "repository.fsl" / "addon.xml").getroot().attrib["version"]

          plugin_stage = public / "_stage" / plugin_id
          repo_stage = public / "_stage" / repo_id
          plugin_stage.mkdir(parents=True)
          repo_stage.mkdir(parents=True)

          excluded = {".git", ".github", "public", "repository.fsl", "_stage"}
          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              rel = path.relative_to(root)
              if rel.parts[0] in excluded:
                  continue
              target = plugin_stage / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(path, target)

          shutil.copy2(root / "repository.fsl" / "addon.xml", repo_stage / "addon.xml")
          logo = root / "docs" / "fsl-logo.jpg"
          if logo.exists():
              shutil.copy2(logo, repo_stage / "icon.jpg")

          def make_zip(source: Path, destination: Path):
              destination.parent.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(destination, "w", zipfile.ZIP_DEFLATED) as archive:
                  for file in sorted(source.rglob("*")):
                      if file.is_file():
                          archive.write(file, file.relative_to(source.parent))

          plugin_zip = public / "zips" / plugin_id / f"{plugin_id}-{plugin_version}.zip"
          repo_zip = public / "zips" / repo_id / f"{repo_id}-{repo_version}.zip"
          make_zip(plugin_stage, plugin_zip)
          make_zip(repo_stage, repo_zip)
          shutil.copy2(repo_zip, public / repo_zip.name)

          addons = ET.Element("addons")
          addons.append(ET.parse(root / "addon.xml").getroot())
          addons.append(ET.parse(root / "repository.fsl" / "addon.xml").getroot())
          xml_bytes = ET.tostring(addons, encoding="utf-8", xml_declaration=True)
          (public / "addons.xml").write_bytes(xml_bytes)
          (public / "addons.xml.md5").write_text(hashlib.md5(xml_bytes).hexdigest(), encoding="ascii")

          page = f"""<!doctype html>
          <html lang='de'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
          <title>Favorite Scene Library Repository</title>
          <style>body{{font-family:system-ui;max-width:760px;margin:48px auto;padding:0 20px;line-height:1.5}}code{{background:#eee;padding:2px 5px}}a{{font-weight:600}}</style></head>
          <body><h1>Favorite Scene Library Repository</h1>
          <p>Kodi-Dateiquelle:</p><p><code>https://scourge76.github.io/favorite-scene-library/</code></p>
          <p><a href='{html.escape(repo_zip.name)}'>repository.fsl-{repo_version}.zip herunterladen</a></p>
          <p>In Kodi: <strong>Add-ons → Aus ZIP-Datei installieren</strong>, danach <strong>Aus Repository installieren → Favorite Scene Library Repository</strong>.</p>
          </body></html>"""
          (public / "index.html").write_text(page, encoding="utf-8")
          shutil.rmtree(public / "_stage")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
